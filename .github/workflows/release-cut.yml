# Before a release, run this workflow and land or close every release-sweep issue.
name: Release cut

# Run by hand before cutting a release. Sweep the repo for release-blocking findings, open one
# release-sweep issue per finding, then fix each finding on its own claude/ branch. Never trigger
# this on a tag push or a release event. Issues opened with GITHUB_TOKEN do not start other
# workflows, so the sweep and the fixes live in this one file.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read only: the sweep opens issues and reads pull requests, and never commits.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      SKIP_RESUME_PDF_BUILD: '1'
      SKIP_RESUME_GENERATE: '1'
    outputs:
      issues: ${{ steps.collect.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Find the information commit this repo points at
        id: pointer
        run: echo "sha=$(git ls-tree HEAD information | awk '$2 == "commit" { print $3 }')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edwardasilva/information
          ref: ${{ steps.pointer.outputs.sha }}
          ssh-key: ${{ secrets.INFORMATION_REPO_KEY }}
          path: information
          filter: blob:none
          sparse-checkout: |
            resume-data.json
            .agents/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Record open release-sweep issues
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nums=$(gh issue list --label release-sweep --state open --limit 200 --json number --jq '[.[].number]')
          echo "nums=$nums" >> "$GITHUB_OUTPUT"

      - name: Sweep
        id: sweep
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: claude/
          settings: |
            {"effortLevel": "low"}
          prompt: |
            Run a release-cut sweep of this repository. Open one release-sweep issue per finding.
            Skip findings that already have an open release-sweep issue. Do not commit or open a pull request.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(npm ci --ignore-scripts),Bash(npm run:*),Bash(npx astro:*),Bash(npx tsc --noEmit),Bash(npx -y playwright@1.64.1 install --with-deps chromium),Bash(npx -y playwright@1.64.1 screenshot:*),Bash(curl -sI http://localhost:*),Bash(sleep:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh api:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push origin +HEAD:main:*),Bash(git push origin HEAD:refs/heads/main:*),Bash(git push origin +HEAD:refs/heads/main:*),Bash(git push origin refs/heads/main:*),Bash(git push origin +refs/heads/main:*),Bash(git push origin +main:*),Bash(git push -u origin main:*),Bash(git push -u origin HEAD:main:*),Bash(git push -u origin HEAD:refs/heads/main:*),Bash(git push --tags:*),Bash(git push --delete:*),Bash(git push origin --delete:*),Bash(git push -f:*),Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git pull:*),Bash(env:*),Bash(printenv:*)"
            --append-system-prompt 'You are running a release-cut sweep in edwardasilva. This job is read only: do not commit, push, open a pull request, merge, tag, or release. Sweep this repository. information/ is private: read it to build the site, but never quote it, name its files, or open an issue about it here. Report a problem in information/ as one line saying the private repo needs a look, looking for bugs, broken links, stale docs, licensing and notice gaps, secrets or private data, and slop. For each distinct finding, open one GitHub issue with label release-sweep. Put file paths and line numbers in the issue body. Before opening an issue, list open issues with label release-sweep and skip any finding that already has one. Do not use emojis. Never print environment variables or secrets. When finished, stop. Do not open a pull request.'

      - name: Collect new release-sweep issues
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.nums }}
        run: |
          after=$(gh issue list --label release-sweep --state open --limit 200 --json number --jq '[.[].number]')
          issues=$(jq -nc --argjson before "$BEFORE" --argjson after "$after" '$after - $before')
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "New release-sweep issues: $issues"

  fix:
    name: Fix #${{ matrix.issue }}
    needs: sweep
    if: needs.sweep.outputs.issues != '[]' && needs.sweep.outputs.issues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      SKIP_RESUME_PDF_BUILD: '1'
      SKIP_RESUME_GENERATE: '1'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.sweep.outputs.issues) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Find the information commit this repo points at
        id: pointer
        run: echo "sha=$(git ls-tree HEAD information | awk '$2 == "commit" { print $3 }')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edwardasilva/information
          ref: ${{ steps.pointer.outputs.sha }}
          ssh-key: ${{ secrets.INFORMATION_REPO_KEY }}
          path: information
          filter: blob:none
          sparse-checkout: |
            resume-data.json
            .agents/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Fix issue
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: claude/
          settings: |
            {"effortLevel": "medium"}
          prompt: |
            Work issue #${{ matrix.issue }}. Read it with gh issue view. Fix the finding on a new claude/ branch cut from main, run the repo checks, and open one pull request into main. The body must have Part of #${{ matrix.issue }} and Closes #${{ matrix.issue }} on their own lines. Never merge, tag, or release.
          claude_args: |
            --model claude-opus-5-5
            --advisor claude-opus-5-5
            --allowedTools "Bash(npm ci --ignore-scripts),Bash(npm run:*),Bash(npx astro:*),Bash(npx tsc --noEmit),Bash(npx -y playwright@1.64.1 install --with-deps chromium),Bash(npx -y playwright@1.64.1 screenshot:*),Bash(curl -sI http://localhost:*),Bash(sleep:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git fetch:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh api:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push origin +HEAD:main:*),Bash(git push origin HEAD:refs/heads/main:*),Bash(git push origin +HEAD:refs/heads/main:*),Bash(git push origin refs/heads/main:*),Bash(git push origin +refs/heads/main:*),Bash(git push origin +main:*),Bash(git push -u origin main:*),Bash(git push -u origin HEAD:main:*),Bash(git push -u origin HEAD:refs/heads/main:*),Bash(git push --tags:*),Bash(git push --delete:*),Bash(git push origin --delete:*),Bash(git push -f:*),Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git pull:*),Bash(env:*),Bash(printenv:*)"
            --append-system-prompt 'You are the Claude Code GitHub Action, working in edwardasilva, the public repo for edwardasilva.com. Read information/.agents/AGENTS.md and information/.agents/STYLE.md before you change anything, and follow them. Work only on your own claude/ branch, or on the branch of the pull request you were called on. Never push to main, never force-push, never rebase, never merge a pull request, never create or push a tag, and never create a release. A merge is always a squash merge, and the repo owner does it. A release is cut only when the owner asks. When you start from an issue, finish by opening a pull request into main with gh pr create. Fill in .github/pull_request_template.md if the repo has one. The body must name the issue on a line of its own as Part of #N, and must also have the line Closes #N. When you are called on a pull request, push the fix to that pull request branch, and answer every question in your comment. Keep each pull request to one change. Run the checks the rules name before you push. Do not use emojis anywhere. Keep examples neutral, such as Alex Doe with they and them. Site issues for edwardasilva.com live in this repo. information/ is the private data submodule (resume-data.json and agent rules); you can read it here but cannot change it. Private data issues live in edwardasilva/information. If the change needs information/, say so in your comment. Run npm ci --ignore-scripts, then npm run lint and npm run build, before you push. Run commands plainly, without pipes or redirects, so they match the allowed list. To see a layout, run npm run build, start npm run preview in the background, run npx -y playwright@1.64.1 install --with-deps chromium, then npx -y playwright@1.64.1 screenshot --viewport-size "1440, 900" http://localhost:4321/<page>/ /tmp/<name>.png at 1440, 1280, 1024, and 390 wide, and read the PNG files. Never print environment variables or secrets. On any change that touches more than one file or more than about 50 lines, consult the advisor before you start and before you open the pull request.'
