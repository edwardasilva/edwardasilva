name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  # Opt in now to the GitHub Actions Node 24 JavaScript runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The "github-pages" environment holds RESUME_DATA and TODO_MD.
    # The pre-push hook keeps both current, so the build always uses the latest resume data.
    environment: github-pages
    env:
      # Optional repo-level Variables you can set in GitHub:
      # - ASTRO_SITE (e.g. https://edwardasilva.com)
      # - ASTRO_BASE (e.g. /, or /your-repo for project pages)
      ASTRO_SITE: ${{ vars.ASTRO_SITE || 'https://edwardasilva.com' }}
      ASTRO_BASE: ${{ vars.ASTRO_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # resume-data.json and TODO.md stay off GitHub.
      # Both are environment secrets on "github-pages":
      # - RESUME_DATA is written here because the build imports it.
      # - TODO_MD is checked so the private notes stay backed up. It is not written into the site.
      - name: Create and validate resume data from secret
        shell: bash
        env:
          RESUME_DATA: ${{ secrets.RESUME_DATA }}
          TODO_MD: ${{ secrets.TODO_MD }}
        run: |
          set -euo pipefail

          if [[ -z "${RESUME_DATA:-}" ]]; then
            echo "::error::RESUME_DATA environment secret is not set on github-pages."
            exit 1
          fi

          if [[ -z "${TODO_MD:-}" ]]; then
            echo "::error::TODO_MD environment secret is not set on github-pages."
            exit 1
          fi

          printf '%s' "$RESUME_DATA" > resume-data.json

          python3 - <<'PY'
          import json
          import sys

          path = "resume-data.json"
          try:
            with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          except Exception as exc:
            print(f"::error::{path} is not valid JSON in RESUME_DATA: {exc}")
            sys.exit(1)

          required_keys = ["personal", "education", "experiences", "projects"]
          missing = [key for key in required_keys if key not in data]
          if missing:
            print(f"::error::{path} is missing required top-level keys: {', '.join(missing)}")
            sys.exit(1)

          print("resume-data.json secret written and validated.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Astro base path (auto for GitHub Pages)
        shell: bash
        run: |
          if [[ -n "${ASTRO_BASE:-}" ]]; then
            echo "Using ASTRO_BASE from repo variables: ${ASTRO_BASE}"
            exit 0
          fi

          # Custom domains should be served from root.
          if [[ -n "${ASTRO_SITE:-}" ]]; then
            SITE_HOST="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          site = os.environ.get("ASTRO_SITE", "")
          host = urlparse(site).hostname or ""
          print(host)
          PY
            )"

            if [[ -n "$SITE_HOST" && "$SITE_HOST" != *.github.io ]]; then
              echo "ASTRO_BASE=/" >> "$GITHUB_ENV"
              echo "Using ASTRO_BASE=/ for custom domain host: $SITE_HOST"
              exit 0
            fi
          fi

          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "ASTRO_BASE=/" >> "$GITHUB_ENV"
          else
            echo "ASTRO_BASE=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SKIP_RESUME_PDF_BUILD: '1'
          SKIP_RESUME_GENERATE: '1'
        run: npm run build

      # Uploads dist/ straight from this job, so the built site is never stored as a workflow artifact.
      # Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=edwardasilva --branch=main --commit-hash=${{ github.sha }}
