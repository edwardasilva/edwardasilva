# .lint/vale/.vale.ini
# Vale Configuration
#
# Author: Edward Silva
# Creation Date: 09 November, 2026
# Last Update: 09 November, 2026
#
# Runs eeprep's plain-English style on the project pages. styles/Eeprep/ is a copy of
# .github/vale/styles/Eeprep from edwardasilva/eeprep. The rules were written in Edward Silva's
# eeprep repo, by him and by automation he runs there. eeprep publishes them under the MIT License;
# this copy is kept here under this repo's all rights reserved terms, and it is committed so CI does
# not need a second checkout. If anyone else ever contributes to eeprep's rules, add eeprep's MIT
# notice beside this copy. `npm run prose:sync` refreshes the copy from a sibling eeprep checkout. The
# vocabulary below holds the proper nouns these pages use that a sentence-case check would otherwise
# flag. Add a proper noun there, never to the Eeprep rules.
#
# Usage:
# $ `npm run prose` : Checks every project page
# $ `npm run prose:sync` : Copies eeprep's rules into styles/Eeprep
#
# Copyright (c) 2026 Edward Silva. All rights reserved.

StylesPath = styles
MinAlertLevel = error
Vocab = Edwardasilva
IgnoredScopes = code, tt, frontmatter

[*.{md,mdx}]
BasedOnStyles = Eeprep
