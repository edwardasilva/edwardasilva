# .lint/vale/.vale.ini
# Vale Configuration
#
# Author: Edward Silva
# Creation Date: 09 November, 2026
# Last Update: 09 November, 2026
#
# Runs eeprep's plain-English style on the project pages. styles/Eeprep/ is a copy of
# .github/vale/styles/Eeprep from edwardasilva/eeprep, kept here because that repo is private and
# CI cannot fetch it. `npm run prose:sync` refreshes the copy from a sibling eeprep checkout. The
# vocabulary below holds the proper nouns these pages use that a sentence-case check would otherwise
# flag. Add a proper noun there, never to the Eeprep rules.
#
# Usage:
# $ `npm run prose` : Checks every project page
# $ `npm run prose:sync` : Copies eeprep's rules into styles/Eeprep
#
# Copyright (c) 2026 Edward Silva. All rights reserved.
# NOTICE: This file contains personal biographical data.
# It is strictly excluded from the repository's MIT License and
# may not be reproduced, distributed, or modified without permission.

StylesPath = styles
MinAlertLevel = error
Vocab = Edwardasilva
IgnoredScopes = code, tt, frontmatter

[*.{md,mdx}]
BasedOnStyles = Eeprep
