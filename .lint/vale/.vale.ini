# .lint/vale/.vale.ini
# Vale Configuration
#
# Author: Edward Silva
# Creation Date: 09 November, 2026
# Last Update: 09 November, 2026
#
# Runs eeprep's plain-English style on the project pages. The Eeprep style itself is not kept here.
# CI checks out .github/vale/styles/Eeprep from edwardasilva/eeprep into styles/ before it runs, so
# the two sites share one copy of the rules. The vocabulary below holds the proper nouns these pages
# use that a sentence-case check would otherwise flag.
#
# Usage:
# $ `vale --config .lint/vale/.vale.ini src/content/docs` : Checks every project page
#
# Copyright (c) 2026 Edward Silva. All rights reserved.
# NOTICE: This file contains personal biographical data.
# It is strictly excluded from the repository's MIT License and
# may not be reproduced, distributed, or modified without permission.

StylesPath = styles
MinAlertLevel = error
Vocab = Edwardasilva
IgnoredScopes = code, tt, frontmatter

[*.{md,mdx}]
BasedOnStyles = Eeprep
